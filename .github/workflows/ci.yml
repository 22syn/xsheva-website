name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    uses: 22syn/ci-templates/.github/workflows/node-ci.yml@main
    with:
      working-directory: xsheva
      run-lint: true
      run-test: false # no test script defined yet
      run-build: true
      run-secrets-scan: true
