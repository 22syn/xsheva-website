name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    uses: 22syn/ci-templates/.github/workflows/node-ci.yml@main
    with:
      working-directory: xsheva
      run-lint: true
      run-test: true # zero-values smoke test — REQ-08, node-ci runs test before build so `npm run test` builds first itself
      run-build: true
      run-secrets-scan: true
